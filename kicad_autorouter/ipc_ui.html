<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible Autorouter</title>
<style>
  :root { --bg:#14161a; --panel:#1c1f24; --line:#2c3038; --text:#e8eaed; --muted:#9aa0a6;
          --accent:#ffe14d; --front:#e8433a; --back:#3b7ddd; --ok:#3fae5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  .app { display:grid; grid-template-columns: 300px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:14px; overflow:auto; }
  h1 { font-size:16px; margin:0 0 10px; }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:0 0 10px; padding:8px 10px; }
  legend { color:var(--muted); font-size:12px; padding:0 4px; }
  label { display:flex; align-items:center; gap:6px; margin:4px 0; }
  .muted { color:var(--muted); font-size:12px; margin:2px 0 8px; }
  label:has(input:disabled) { opacity:.45; }
  .row { display:flex; justify-content:space-between; align-items:center; margin:3px 0; }
  .row input { width:80px; background:#111317; color:var(--text); border:1px solid var(--line);
               border-radius:4px; padding:3px 6px; }
  button { background:#2b3038; color:var(--text); border:1px solid var(--line); border-radius:6px;
           padding:7px 14px; cursor:pointer; font-weight:600; }
  button.primary { background:#2f6f3e; border-color:#3c8a4e; }
  button:disabled { opacity:.45; cursor:default; }
  #log { background:#0f1114; border:1px solid var(--line); border-radius:6px; padding:6px;
         font:12px/1.35 ui-monospace, monospace; white-space:pre-wrap; height:220px; overflow:auto; margin-top:10px; }
  main { display:grid; grid-template-rows:auto auto 1fr auto; min-width:0; }
  #status { padding:6px 14px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-size:13px; }
  .bar { display:flex; align-items:center; gap:10px; padding:12px 14px 6px; flex-wrap:wrap; }
  button.big { font-size:18px; font-weight:700; padding:12px 26px; border-radius:8px; border:0; color:#fff;
               min-width:130px; min-height:50px; }
  button.big.go { background:#2e7d32; } button.big.go:hover:not(:disabled) { background:#388e3c; }
  #choice { margin:6px 8px; padding:10px 12px; border:1px solid #f0b429; border-radius:8px;
            background:rgba(240,180,41,.10); }
  #choice button.big { min-width:200px; margin:8px 8px 0 0; }
  button.big.stop { background:#c62828; } button.big.stop:hover:not(:disabled) { background:#d32f2f; }
  button.big.close { background:#4a505a; } button.big.close:hover:not(:disabled) { background:#5a616c; }
  .prog { flex:1; min-width:260px; margin-left:8px; }
  #headline { font-size:20px; font-weight:700; }
  #detail { color:var(--muted); font-size:13px; margin:2px 0 6px; min-height:17px; }
  .track { height:14px; background:#2a2e35; border-radius:7px; overflow:hidden; margin-bottom:5px; }
  .track.thin { height:6px; }
  .fill { height:100%; width:0%; background:linear-gradient(90deg,#3b7ddd,#4cc9f0); transition:width .25s; }
  .track.thin .fill { background:#6b7380; }
  .stage { position:relative; min-height:0; }
  canvas#board { width:100%; height:100%; display:block; }
  #curve { display:block; width:100%; margin-top:10px; background:#0f1114;
           border:1px solid var(--line); border-radius:6px; }
  footer { padding:6px 14px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin:0 3px 0 10px; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; height:auto; } .stage { height:70vh; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Visible Autorouter</h1>
    <div id="summary" class="muted"></div>
    <fieldset><legend>What to route</legend>
      <label title="Only the missing connections (the ratsnest). Existing tracks and vias are never moved or removed.">
        <input type="radio" name="scope" value="unrouted" id="scopeUnr" checked> <span id="unrLabel">Unrouted only</span></label>
      <label><input type="radio" name="scope" value="selected" id="scopeSel"> <span id="selLabel">Selected</span></label>
      <label><input type="radio" name="scope" value="all" id="scopeAll"> All nets</label>
      <div id="scopeHelp" class="muted"></div>
    </fieldset>
    <fieldset><legend>Rules (Default net class)</legend>
      <div class="row">Track width (mm) <input id="track_width"></div>
      <div class="row">Clearance (mm) <input id="clearance"></div>
      <div class="row">Via diameter (mm) <input id="via_diameter"></div>
      <div class="row">Via drill (mm) <input id="via_drill"></div>
      <div class="row">Edge clearance (mm) <input id="edge_clearance"></div>
      <div class="row">Max passes <input id="max_passes"></div>
      <div class="row">Via cost (grid steps) <input id="via_cost"></div>
    </fieldset>
    <label><input type="checkbox" id="rip"> Remove existing tracks of these nets first (re-route from scratch)</label>
    <label title="Track pieces and vias that touch no pad (e.g. unfinished traces). Removed in the same undo step.">
      <input type="checkbox" id="loose" checked> <span id="looseLabel">Delete loose track pieces (copper touching no pad)</span></label>
    <label><input type="checkbox" id="showOld" checked> Show existing tracks</label>
    <label><input type="checkbox" id="fanout" checked> Connect pour nets (GND, +5…) to their pour</label>
    <label><input type="checkbox" id="pourTracks"> Route pour nets with tracks too (don't rely on the pour)</label>
    <label title="Inner layers covered by a pour (GND / power planes) are normally kept solid: signals only pass through them with vias. Tick to route signals on them too (more room, but the planes get cut up).">
      <input type="checkbox" id="planeTracks"> Allow tracks on plane layers (inner GND / power planes)</label>
    <label><input type="checkbox" id="fill" checked> Refill zones when done</label>
    <canvas id="curve" width="272" height="120"></canvas>
    <div id="log"></div>
  </aside>
  <main>
    <div class="bar">
      <button class="big go" id="go">&#9654;&nbsp; Route</button>
      <button class="big stop" id="stop" disabled>&#9632;&nbsp; Stop</button>
      <button class="big close" id="close">Close</button>
      <div class="prog">
        <div id="headline">Ready - press Route to start.</div>
        <div id="detail"></div>
        <div class="track"><div class="fill" id="fillAll"></div></div>
        <div class="track thin"><div class="fill" id="fillPass"></div></div>
      </div>
    </div>
    <div id="choice" style="display:none">
      <div id="choiceText"></div>
      <button class="big go" id="keep" title="Put what was routed on the board, straightened (zig-zags become straight runs), like a finished run">Keep (straightened)</button>
      <button class="big stop" id="discard">Discard it</button>
    </div>
    <div id="status">Loading board…</div>
    <div class="stage"><canvas id="board"></canvas></div>
    <footer>
      <span class="sw" style="background:#7a3a35"></span>existing copper
      <span id="layerLegend"></span>
      <span class="sw" style="background:#e0782a"></span>learned congestion
      <span class="sw" style="background:var(--accent)"></span>two nets fighting
      <span class="sw" style="background:#4cc9f0"></span>A* wavefront
    </footer>
  </main>
</div>
<script>
// fixed colour per layer NAME (same as the classic window): front red, back blue, inner in turn
const INNER = [["#3fae5a","green"],["#a05ad1","purple"],["#2bb5b0","teal"],["#d670aa","pink"],["#969646","olive"],["#788ce6","lavender"]];
function layerColour(name) {
  if (name === "F.Cu") return ["#e8433a", "red"];
  if (name === "B.Cu") return ["#3b7ddd", "blue"];
  const m = /^In(\d+)\./.exec(name || "");
  return INNER[((m ? +m[1] : 1) - 1) % INNER.length];
}
const oldCol = i => layerColour(S.layers[i])[0];               // existing copper: board layer index
const newCol = (i, G) => layerColour(G && G.layers ? G.layers[i] : S.layers[i])[0];   // routes: grid layer index
let S = null, ST = { frame:{}, curve:[], log:[] }, lastVersion = -1;
const $ = id => document.getElementById(id);
const cv = $("board"), ctx = cv.getContext("2d");

async function j(url, body) {
  const r = await fetch(url, body ? {method:"POST", body: JSON.stringify(body)} : {});
  return r.json();
}

async function init() {
  await loadStatic();
  const s = S.settings;
  for (const k of ["track_width","clearance","via_diameter","via_drill","edge_clearance","max_passes","via_cost"])
    $(k).value = +(+s[k]).toFixed(4);
  if (S.selected.length) $("scopeSel").checked = true;
  scopeChanged(); resize(); poll();
}

async function loadStatic() {
  S = await j("/static");
  const c = S.counts, todo = (c.unrouted || 0) + (c.partial || 0), n = S.selected.length;
  $("summary").innerHTML = `Board: <b>${c.routed || 0}</b> routed · <b>${c.partial || 0}</b> partly routed · ` +
    `<b>${c.unrouted || 0}</b> unrouted${c.pour ? ` · ${c.pour} pour` : ""}<br>` +
    `${S.tracks.length} existing track segments` + (() => {
      const per = {}; for (const t of S.tracks) per[t[0]] = (per[t[0]] || 0) + 1;
      const parts = S.layers.map((n, i) => per[i] ? `${n} ${per[i]}` : "").filter(Boolean);
      return parts.length ? ` (${parts.join(", ")})` : "";
    })() + `, ${S.vias.length} vias` +
    (S.loose ? `<br><span style="color:#f0b45a">${S.loose} loose track piece(s) touch no pad</span>` : "");
  $("layerLegend").innerHTML = S.layers.map(n =>
    `<span class="sw" style="background:${layerColour(n)[0]}"></span>${n}`).join("");
  $("looseLabel").textContent = `Delete loose track pieces (copper touching no pad)${S.loose ? ` - ${S.loose} found` : ""}`;
  $("unrLabel").textContent = `Unrouted only (${todo} net${todo === 1 ? "" : "s"} to finish)`;
  $("selLabel").textContent = `Selected (${n} net${n === 1 ? "" : "s"})`;
  $("scopeSel").disabled = !n;
  if (!n && $("scopeSel").checked) $("scopeUnr").checked = true;
  draw();
}

function scopeChanged() {
  const sc = document.querySelector("input[name=scope]:checked").value;
  $("rip").disabled = sc === "unrouted";
  if (sc === "unrouted") $("rip").checked = false;
  $("scopeHelp").textContent = {
    unrouted: "Finishes only the missing connections. Existing tracks and vias stay exactly as they are.",
    selected: "Routes the nets of the selected parts/pads/tracks. Existing copper is kept unless you tick Remove.",
    all: "Every net. Existing copper is kept (and connected to) unless you tick Remove - then all nets are re-routed.",
  }[sc];
}
document.querySelectorAll("input[name=scope]").forEach(r => r.addEventListener("change", scopeChanged));
$("showOld").addEventListener("change", () => draw());

function view() {
  const [x0,y0,x1,y1] = S.bbox, m = 1;
  const W = cv.width, H = cv.height;
  const sc = Math.min(W / (x1 - x0 + 2*m), H / (y1 - y0 + 2*m));
  const ox = (W - (x1 - x0) * sc) / 2 - x0 * sc, oy = (H - (y1 - y0) * sc) / 2 - y0 * sc;
  return { sc, X: x => ox + x * sc, Y: y => oy + y * sc };
}

function draw() {
  if (!S) return;
  const v = view(), dpr = window.devicePixelRatio || 1;
  ctx.fillStyle = "#14161a"; ctx.fillRect(0, 0, cv.width, cv.height);
  // board
  ctx.fillStyle = "#0d2416";
  const [x0,y0,x1,y1] = S.bbox;
  ctx.fillRect(v.X(x0), v.Y(y0), (x1 - x0) * v.sc, (y1 - y0) * v.sc);
  const G = ST.grid, F = ST.frame || {};
  const cell = (xy, color) => {
    const gx = xy % G.nx, gy = Math.floor(xy / G.nx);
    const cx = G.x0 + gx * G.pitch, cy = G.y0 + gy * G.pitch, h = G.pitch / 2;
    ctx.fillStyle = color; ctx.fillRect(v.X(cx - h), v.Y(cy - h), G.pitch * v.sc + .5, G.pitch * v.sc + .5);
  };
  if (G && F.heat) for (const [xy, h] of F.heat) cell(xy, `rgba(224,120,42,${Math.min(.85, .15 + Math.log1p(h) / 3)})`);
  if (G && F.explored) for (const xy of F.explored) cell(xy, "rgba(76,201,240,.28)");
  // outline
  ctx.strokeStyle = "#e5d38a"; ctx.lineWidth = 1.2 * dpr;
  for (const [a,b,c,d] of S.outline) { ctx.beginPath(); ctx.moveTo(v.X(a), v.Y(b)); ctx.lineTo(v.X(c), v.Y(d)); ctx.stroke(); }
  // pads
  for (const p of S.pads) {
    ctx.fillStyle = p.net ? "rgba(170,176,182,.9)" : "rgba(100,104,108,.9)";
    ctx.beginPath();
    if (p.poly) { p.poly.forEach(([x, y], i) => i ? ctx.lineTo(v.X(x), v.Y(y)) : ctx.moveTo(v.X(x), v.Y(y))); ctx.closePath(); }
    else ctx.arc(v.X(p.c[0]), v.Y(p.c[1]), p.r * v.sc, 0, 7);
    ctx.fill();
  }
  for (const [hx, hy, hd] of S.holes) { ctx.fillStyle = "#0a0c0e"; ctx.beginPath(); ctx.arc(v.X(hx), v.Y(hy), hd / 2 * v.sc, 0, 7); ctx.fill(); }
  // existing copper, dimmed so the router's new work stands out (back layers first)
  if ($("showOld").checked) {
    ctx.lineCap = "round"; ctx.globalAlpha = .5;
    for (const t of S.tracks.slice().sort((a, b) => b[0] - a[0])) {
      ctx.strokeStyle = oldCol(t[0]);
      ctx.lineWidth = Math.max(1 * dpr, t[5] * v.sc);
      ctx.beginPath(); ctx.moveTo(v.X(t[1]), v.Y(t[2])); ctx.lineTo(v.X(t[3]), v.Y(t[4])); ctx.stroke();
    }
    ctx.fillStyle = "#bbb";
    for (const [x, y, d] of S.vias) { ctx.beginPath(); ctx.arc(v.X(x), v.Y(y), Math.max(2 * dpr, d / 2 * v.sc), 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  if (!G) return;
  const P = xy => [v.X(G.x0 + (xy % G.nx) * G.pitch), v.Y(G.y0 + Math.floor(xy / G.nx) * G.pitch)];
  // tracks: back layers first
  const paths = (F.paths || []).slice().sort((a, b) => b[0] - a[0]);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const [l, run, hl] of paths) {
    ctx.strokeStyle = newCol(l, G);
    ctx.lineWidth = Math.max(1.5 * dpr, (hl ? 1.6 : 1) * 0.25 * v.sc);
    ctx.globalAlpha = hl ? 1 : .88;
    ctx.beginPath(); run.forEach((xy, i) => { const [x, y] = P(xy); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const xy of F.vias || []) {
    const [x, y] = P(xy); ctx.fillStyle = "#ddd"; ctx.beginPath();
    ctx.arc(x, y, Math.max(2.5 * dpr, 0.3 * v.sc), 0, 7); ctx.fill();
  }
  ctx.strokeStyle = "#ffe14d"; ctx.lineWidth = 1.5 * dpr;
  for (const xy of F.over || []) { const [x, y] = P(xy), h = G.pitch * v.sc / 2 + 1; ctx.strokeRect(x - h, y - h, 2*h, 2*h); }
}

function drawCurve() {
  const c = $("curve"), g = c.getContext("2d"), d = ST.curve || [];
  g.clearRect(0, 0, c.width, c.height);
  g.fillStyle = "#9aa0a6"; g.font = "11px system-ui"; g.fillText("overused cells per pass", 8, 14);
  if (!d.length) return;
  const max = Math.max(1, ...d), n = Math.max(5, d.length);
  g.strokeStyle = "#2c3038"; g.beginPath(); g.moveTo(14, c.height - 12); g.lineTo(c.width - 10, c.height - 12); g.stroke();
  const X = i => 14 + (c.width - 24) * i / (n - 1), Y = y => c.height - 12 - (c.height - 34) * y / max;
  g.strokeStyle = "#ffe14d"; g.lineWidth = 1.6; g.beginPath();
  d.forEach((y, i) => i ? g.lineTo(X(i), Y(y)) : g.moveTo(X(i), Y(y))); g.stroke();
  g.fillStyle = "#ffe14d"; d.forEach((y, i) => { g.beginPath(); g.arc(X(i), Y(y), 2.4, 0, 7); g.fill(); });
  g.fillStyle = "#9aa0a6"; g.fillText(String(max), 4, 28); g.fillText("0", 4, c.height - 8);
}

async function poll() {
  try {
    const st = await j("/state");
    if (S && st.static_version !== S.static_version) await loadStatic();
    if (st.version !== lastVersion) {
      lastVersion = st.version; ST = st;
      $("status").textContent = st.status;
      const p = st.progress;
      const c = st.cleaning;
      if (c) {                       // the last step: straightening, net by net
        $("headline").textContent = `Straightening - ${c.stage}`;
        $("detail").textContent = `net ${c.index} of ${c.total}: ${c.net}`;
        $("fillAll").style.width = "100%";
        $("fillPass").style.width = (100 * c.index / Math.max(1, c.total)).toFixed(1) + "%";
      } else if (p) {
        $("fillAll").style.width = (p.fraction * 100).toFixed(1) + "%";
        $("fillPass").style.width = (100 * p.pass_done / Math.max(1, p.pass_total)).toFixed(1) + "%";
        if (st.stopping) { $("headline").textContent = "Stopping after the current net..."; }
        else if (st.running) { $("headline").textContent = p.headline; $("detail").textContent = p.detail; }
        else { $("headline").textContent = p.phase === "done" ? p.headline : "Stopped";
               $("detail").textContent = st.status; }
      }
      const log = $("log"); log.textContent = st.log.join("\n"); log.scrollTop = log.scrollHeight;
      draw(); drawCurve();
    }
    const a = st.awaiting;
    $("choice").style.display = a ? "block" : "none";
    if (a) {
      $("choiceText").textContent = `Routing was stopped after ${a.passes} pass(es). So far ${a.complete} of ${a.total} nets ` +
        `are completely routed (${a.segments} track segments)` +
        (a.left_out.length ? `; nets still in conflict are left out: ${a.left_out.join(", ")}` : "") +
        ". Keep it (straightened), or throw it away?";
      $("headline").textContent = "Stopped - keep or discard?";
    }
    $("go").disabled = st.running; $("stop").disabled = !st.running || !!a || !!st.cleaning;
    $("close").disabled = st.running;
    setTimeout(poll, st.running ? 120 : 800);
  } catch (e) {
    $("status").textContent = "Plugin process has ended - you can close this tab.";
  }
}

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(100, r.width * dpr); cv.height = Math.max(100, r.height * dpr); draw();
}
window.addEventListener("resize", resize);

$("go").onclick = () => {
  const o = { scope: document.querySelector("input[name=scope]:checked").value,
              rip: $("rip").checked, fanout: $("fanout").checked, fill: $("fill").checked,
              remove_loose: $("loose").checked, pour_tracks: $("pourTracks").checked,
              tracks_on_planes: $("planeTracks").checked };
  for (const k of ["track_width","clearance","via_diameter","via_drill","edge_clearance","via_cost"]) o[k] = parseFloat($(k).value);
  o.max_passes = parseInt($("max_passes").value, 10);
  $("fillAll").style.width = "0%"; $("fillPass").style.width = "0%";
  $("headline").textContent = "Starting..."; $("detail").textContent = "";
  j("/route", o);
};
$("keep").onclick = () => { $("choice").style.display = "none"; j("/choice", {choice: "keep"}); };
$("discard").onclick = () => { $("choice").style.display = "none"; j("/choice", {choice: "discard"}); };
$("stop").onclick = () => { $("stop").disabled = true; $("headline").textContent = "Stopping after the current net..."; j("/stop", {}); };
$("close").onclick = async () => {
  await j("/close", {});
  window.close();             // works in the router's own app window
  setTimeout(() => { $("status").textContent = "Closed - you can close this tab."; }, 300);
};
init();
</script>
</body>
</html>
